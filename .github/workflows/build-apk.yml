name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

defaults:
  run:
    working-directory: gp-android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      - run: npm ci
      - run: npx cap add android

      - name: Add direct-WhatsApp plugin
        run: python3 native/add_wa_plugin.py

      - run: npx capacitor-assets generate --android
      - run: npx cap sync android

      - name: Build APK
        working-directory: gp-android/android
        run: |
          chmod +x gradlew
          if ! ./gradlew assembleDebug; then
            echo "::warning::Direct-WhatsApp plugin सह build अयशस्वी — plugin शिवाय पुन्हा build करत आहे"
            python3 ../native/add_wa_plugin.py --remove
            ./gradlew assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: GP-Software-APK
          path: gp-android/android/app/build/outputs/apk/debug/app-debug.apk
